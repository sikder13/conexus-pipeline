[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conexus-pipeline"
version = "0.1.0"
description = "Prospect research and outreach pipeline for Nahl Technologies"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7,<3",
    "rich>=13.7",
    "anthropic>=0.40",
    "supabase>=2.15",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.setuptools]
packages = [
    "lib",
    "tools",
    "tools.drafter",
    "tools.extractor",
    "tools.harvester",
    "tools.logger",
    "tools.verifier",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lib", "tools"]
# The repo-root `supabase/` directory holds migrations, not a Python package;
# without this, isort mistakes the supabase-py import for first-party code.
known-third-party = ["supabase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
