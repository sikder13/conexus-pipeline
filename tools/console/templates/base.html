<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Console{% endblock %} · Conexus</title>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">Conexus console</a>
    <nav class="nav">
      <a href="/">Dashboard</a>
      <a href="/companies">Companies</a>
      <a href="/outreach">Outreach</a>
    </nav>
    {% block headerbits %}{% endblock %}
  </header>
  <main>{% block body %}{% endblock %}</main>
  <script>
    // One handler for every copy button. The operator is typing these into a
    // mail client by hand; a mis-transcribed address is a bounced first
    // impression, so the value is copied rather than retyped.
    document.addEventListener('click', function (e) {
      var b = e.target.closest('.copy');
      if (!b) return;
      var el = document.getElementById(b.dataset.copy);
      if (!el) return;
      navigator.clipboard.writeText(el.textContent.trim()).then(function () {
        var was = b.textContent; b.textContent = 'copied';
        setTimeout(function () { b.textContent = was; }, 1200);
      });
    });
  </script>
  {% block script %}{% endblock %}
</body>
</html>
